# Runs on every pull request into master and every push to master.
#   build  typecheck + production build (npm run build)
#   e2e    the full Playwright suite (desktop + mobile projects) against a throwaway Synapse in Docker,
#          started and seeded the same way as locally: npm run hs:up && npm run seed
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts skips the postinstall browser download; the next step installs it with its OS deps.
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start Synapse
        run: npm run hs:up
      - name: Seed test data
        run: npm run seed
      - name: Run Playwright
        run: npx playwright test
        env:
          CI: 'true'
      - name: Synapse logs
        if: failure()
        run: docker compose -f homeserver/docker-compose.yml logs --tail 200 synapse
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/results/
          retention-days: 14
