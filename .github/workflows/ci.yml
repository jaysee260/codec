# Runs on every pull request into master and every push to master.
#   build  typecheck + production build (npm run build) + unit tests (npm run test:unit, node:test, src/**/*.test.ts + scripts/**/*.test.mjs)
#   e2e    Playwright (desktop + mobile projects), in parallel: Playwright's global setup builds the seed snapshot and
#          starts one throwaway Synapse (from homeserver/.venv) + one Vite per worker (issue #2).
#          Pushes to master, manual runs and PRs labelled `full-e2e` run the whole suite; other PRs run the smoke
#          walk-throughs plus the specs for the areas they change (scripts/select-e2e.mjs; shared code -> everything).
name: CI

on:
  pull_request:
    branches: [master]
    # `labeled` so adding `full-e2e` re-runs the PR with the whole suite.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # select-e2e diffs the PR against its base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pick specs
        id: pick
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-e2e') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$FULL" = "true" ]; then specs=ALL; else specs=$(node scripts/select-e2e.mjs "$BASE"); fi
          echo "Specs: $specs"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
      # --ignore-scripts skips the postinstall browser download; the next step installs it with its OS deps.
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Synapse
        run: python -m venv homeserver/.venv && homeserver/.venv/bin/pip install 'matrix-synapse[url-preview]'
      - name: Run Playwright
        run: |
          if [ "$SPECS" = "ALL" ]; then npx playwright test; else npx playwright test $SPECS; fi
        env:
          CI: 'true'
          SPECS: ${{ steps.pick.outputs.specs }}
      - name: Synapse logs
        if: failure()
        run: tail -n 200 homeserver/data/pool/snapshot-build.log homeserver/data/pool/hs-*/synapse.log || true
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/results/
          retention-days: 14
